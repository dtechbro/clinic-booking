services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_local_only
      POSTGRES_DB: clinic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 3s
      retries: 20
