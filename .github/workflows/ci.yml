name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_local_only
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://clinic:clinic_local_only@127.0.0.1:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          sed -i 's@/clinic$@/clinic_test@' backend/.env
          npm run db:migrate
          npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
